<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a1a"/>
      <stop offset="50%" stop-color="#3f2418"/>
      <stop offset="100%" stop-color="#6a4830"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.3" cy="0.3" r="0.6">
      <stop offset="0%" stop-color="#B8860B" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#B8860B" stop-opacity="0"/>
    </radialGradient>
    <filter id="softShadow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feOffset dx="0" dy="2" result="offsetBlur"/>
      <feMerge><feMergeNode in="offsetBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Decorative diagonal lines (texture) -->
  <g opacity="0.04">
    <line x1="0" y1="0" x2="1200" y2="630" stroke="#fff" stroke-width="1"/>
    <line x1="0" y1="100" x2="1200" y2="730" stroke="#fff" stroke-width="1"/>
    <line x1="0" y1="200" x2="1200" y2="830" stroke="#fff" stroke-width="1"/>
    <line x1="0" y1="-100" x2="1200" y2="530" stroke="#fff" stroke-width="1"/>
    <line x1="0" y1="-200" x2="1200" y2="430" stroke="#fff" stroke-width="1"/>
  </g>

  <!-- Top brand line -->
  <text x="80" y="90" font-family="serif" font-size="20" fill="#F7F4EE" opacity="0.6" letter-spacing="8">
    PIKA☆UNIA  ／  リアル自己解放セッション
  </text>

  <!-- Divider -->
  <line x1="80" y1="120" x2="240" y2="120" stroke="#B8860B" stroke-width="1.5"/>

  <!-- Main headline -->
  <text x="80" y="260" font-family="'Shippori Mincho', serif" font-size="76" font-weight="600" fill="#F7F4EE" filter="url(#softShadow)">
    あなたの本音が、
  </text>
  <text x="80" y="360" font-family="'Shippori Mincho', serif" font-size="76" font-weight="600" fill="#F7F4EE" filter="url(#softShadow)">
    世界の価値になる。
  </text>

  <!-- Subline -->
  <text x="80" y="440" font-family="serif" font-size="24" fill="#F7F4EE" opacity="0.85" letter-spacing="2">
    呼吸・身体・声・意識・感情で、本音を解放する90分。
  </text>
  <text x="80" y="478" font-family="serif" font-size="24" fill="#F7F4EE" opacity="0.85" letter-spacing="2">
    大阪・東京 — 無料リアル体験、受付中。
  </text>

  <!-- CTA box -->
  <rect x="80" y="530" width="320" height="64" rx="32" fill="#06C755"/>
  <text x="240" y="570" font-family="sans-serif" font-size="20" font-weight="700" fill="#fff" text-anchor="middle" letter-spacing="3">
    LINEで日程を受け取る
  </text>

  <!-- Right side accent (gold star motif for PIKA☆) -->
  <g transform="translate(1020, 315)">
    <circle r="100" fill="none" stroke="#B8860B" stroke-width="1.5" opacity="0.4"/>
    <circle r="70" fill="none" stroke="#B8860B" stroke-width="1" opacity="0.6"/>
    <text x="0" y="12" font-family="serif" font-size="96" fill="#B8860B" text-anchor="middle" opacity="0.9">☆</text>
  </g>

  <!-- Footer mark -->
  <text x="80" y="610" font-family="sans-serif" font-size="12" fill="#F7F4EE" opacity="0.5" letter-spacing="3">
    PIKA☆ (水内 美根子)  ／  Power to the People
  </text>
</svg>
